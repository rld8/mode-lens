<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">ModeLens architecture</title>
  <desc id="desc">Interfaces call application use cases, which depend on domain services and ports implemented by adapters.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="980" height="340" rx="16" fill="#f5f7fa"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="50" y="120" width="180" height="90" rx="12" fill="#fff" stroke="#35618f" stroke-width="2"/><text x="140" y="158" font-size="20" fill="#17212b">Interfaces</text><text x="140" y="185" font-size="14" fill="#52606d">Streamlit · Typer</text>
    <rect x="300" y="120" width="190" height="90" rx="12" fill="#fff" stroke="#35618f" stroke-width="2"/><text x="395" y="158" font-size="20" fill="#17212b">Application</text><text x="395" y="185" font-size="14" fill="#52606d">Use cases · DTOs</text>
    <rect x="560" y="50" width="180" height="90" rx="12" fill="#fff" stroke="#ef8354" stroke-width="2"/><text x="650" y="88" font-size="20" fill="#17212b">Domain</text><text x="650" y="115" font-size="14" fill="#52606d">Signals · modes · beam</text>
    <rect x="560" y="200" width="180" height="90" rx="12" fill="#fff" stroke="#35618f" stroke-width="2"/><text x="650" y="238" font-size="20" fill="#17212b">Ports</text><text x="650" y="265" font-size="14" fill="#52606d">Video · tracking · reports</text>
    <rect x="800" y="200" width="140" height="90" rx="12" fill="#fff" stroke="#35618f" stroke-width="2"/><text x="870" y="238" font-size="20" fill="#17212b">Adapters</text><text x="870" y="265" font-size="14" fill="#52606d">OpenCV · files</text>
  </g>
  <g stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"><path d="M230 165 H292"/><path d="M490 150 L555 105"/><path d="M490 180 L555 235"/><path d="M740 245 H792"/></g>
</svg>

