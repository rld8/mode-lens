quality:
  blur_threshold: 80.0
  minimum_contrast: 20.0
  maximum_camera_motion_px: 2.5
tracking:
  method: lucas_kanade
  points: 32
  window_size: 21
  pyramid_levels: 3
  forward_backward_px: 1.5
  max_missing_ratio: 0.20
  search_radius_px: 45
signal:
  highpass_hz: 0.2
  lowpass_hz: null
