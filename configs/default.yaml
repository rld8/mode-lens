  max_components: 8
  minimum_peak_prominence: 0.05
  minimum_relative_modal_score: 0.002
  minimum_frequency_hz: 0.5
uncertainty:
  bootstrap_samples: 200
  confidence_level: 0.95
  fps_relative_std: 0.0
  scale_relative_std: 0.0
experiment:
  boundary_condition: cantilever
  roi: null
